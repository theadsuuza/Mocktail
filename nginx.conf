# Serves the repo root as-is,
# the same way GitHub Pages does. Mounted as the main nginx config.
#
# `user root` is needed only in the sandbox: the bind-mounted repo root is
# mode 700, so the default unprivileged worker user cannot traverse it.
# It does not affect how the site behaves or deploys.
user root;
worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Keep the preview fresh — don't cache edited assets.
    add_header Cache-Control "no-store" always;
  }
}
